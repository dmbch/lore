[tools]
# Must satisfy required-version in pyproject.toml [tool.uv]; bump together.
uv = "0.12.1"
# Only for litellm's sdist build: since 1.92.0 litellm bundles a Rust
# extension but ships no macOS wheels yet (BerriAI/litellm#31261); drop
# this tool when prebuilt macOS wheels land.
rust = { version = "1.97.1", os = ["macos"] }

[env]
# Cargo home at the repo root, gitignored: litellm's sdist build writes its
# registry cache there, writable on any machine, sandboxed sessions included;
# inert off macos, where litellm ships wheels. Rustup proxies resolve from
# either bin entry: fresh machines get them under the project cargo home
# (rustup installs proxies to $CARGO_HOME/bin), machines with a default
# rustup keep ~/.cargo/bin.
CARGO_HOME = "{{config_root}}/.cargo"
_.path = ["{{config_root}}/.cargo/bin", "{{env.HOME}}/.cargo/bin"]

DATABASE_URL = "sqlite:///lore.db"
FASTMCP_LOG_ENABLED = "false"
FASTMCP_SHOW_SERVER_BANNER = "false"

_.file = ".env"
_.python.venv = ".venv"

[tasks.test]
run = "uv run pytest"

[tasks.types]
run = "uv run pyright"

[tasks.lint]
run = "uv run ruff check . && uv run ruff format --check ."

# Plain python, not uv run: the check must still run when the local uv itself
# fails required-version, which is the very drift being reported.
[tasks."check:uv-pin"]
run = "python scripts/check_uv_pin.py"

# Layer-boundary enforcement; the graph lives in tach.toml.
[tasks.tach]
run = "uv run tach check"

[tasks.check]
depends = ["test", "types", "lint", "check:uv-pin", "tach"]

# Mirrored by the e2e job in .github/workflows/release.yml; keep the flags in sync.
[tasks.e2e]
run = "uv run pytest -m e2e --no-cov -n auto --dist loadgroup --durations=20"

[tasks.golden-rebuild]
run = "uv run python -m tests.e2e.fixtures.rebuild_golden"

# Mutation baseline for lore.math; config in [tool.mutmut]. Inspect survivors
# afterward with `uv run mutmut results`. Standalone: slow, not a commit gate.
[tasks.mutation]
run = "uv run mutmut run"

[tasks.serve]
run = "fastmcp run"

# MCP Inspector: interactive tool/resource/prompt poking.
[tasks.dev]
run = "fastmcp dev inspector fastmcp.json"

# MCP Apps dev harness: live iframe render of the observatory.
[tasks.app]
run = "fastmcp dev apps fastmcp.json"

[tasks.install-claude-code]
run = "fastmcp install claude-code fastmcp.json --env-file .env.claude"

[tasks.install-claude-desktop]
run = "fastmcp install claude-desktop fastmcp.json --env-file .env.claude"

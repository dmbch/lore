[tools]
# Must satisfy required-version in pyproject.toml [tool.uv]; bump together.
uv = "0.12.7"
# Only for litellm's sdist build: since 1.92.0 litellm bundles a Rust
# extension but ships no macOS wheels yet (BerriAI/litellm#31261); drop
# this tool when prebuilt macOS wheels land.
rust = { version = "1.97.1", os = ["macos"] }

[env]
# Cargo home at the repo root, gitignored: litellm's sdist build writes its
# registry cache there, writable on any machine, sandboxed sessions included;
# inert off macos, where litellm ships wheels. Rustup proxies resolve from
# either bin entry: fresh machines get them under the project cargo home
# (rustup installs proxies to $CARGO_HOME/bin), machines with a default
# rustup keep ~/.cargo/bin.
CARGO_HOME = "{{config_root}}/.cargo"
_.path = ["{{config_root}}/.cargo/bin", "{{env.HOME}}/.cargo/bin"]

DATABASE_URL = "sqlite:///lore.db"
FASTMCP_LOG_ENABLED = "false"
FASTMCP_SHOW_SERVER_BANNER = "false"

_.file = ".env"
_.python.venv = ".venv"

[tasks.test]
run = "uv run pytest"

[tasks.types]
run = "uv run pyright"

[tasks.lint]
run = "uv run ruff check . && uv run ruff format --check ."

# Covers the uv and python pins. Plain python, not uv run: the check must
# still run when the local uv itself fails required-version, which is the
# very drift being reported.
[tasks."check:pins"]
run = "python scripts/check_pins.py"

# Layer-boundary enforcement; the graph lives in tach.toml.
[tasks.tach]
run = "uv run tach check"

[tasks.check]
depends = ["test", "types", "lint", "check:pins", "tach"]

# Flags and their reasons live in scripts/e2e.sh, shared with the release.yml
# e2e job.
[tasks.e2e]
run = "scripts/e2e.sh"

# Pass-rate measurement for the stochastic e2e suites; the protocol is k >= 5
# (docs/testing.md). Everything after -- passes through to pytest for
# selection: `mise run rate -- tests/e2e/test_consult_shapes.py`.
# Artifacts (rate log, per-run traces) persist to a printed tempdir or
# --artifacts DIR; /rate-analyze reads them.
[tasks.rate]
run = "uv run python scripts/rate.py"

# Retrieval-recall eval over the labeled query set; the delta protocol is in
# docs/testing.md. Everything after -- passes through to the script:
# `mise run recall -- --artifacts DIR --prompt PATH`. Artifacts (recall log)
# persist to a printed tempdir or --artifacts DIR.
[tasks.recall]
run = "uv run python scripts/recall.py"

# Whole recall measurement session: optional golden rebuild, candidate run,
# old-prompt delta run and per-lane comparison. Everything after -- passes
# through: `mise run recall-protocol -- --rebuild --old-ref REF --artifacts DIR`.
[tasks.recall-protocol]
run = "uv run python scripts/recall_protocol.py"

[tasks.golden-rebuild]
run = "uv run python -m tests.e2e.fixtures.rebuild_golden"

# Mutation baseline for lore.math; config in [tool.mutmut]. Inspect survivors
# afterward with `uv run mutmut results`. Standalone: slow, not a commit gate.
[tasks.mutation]
run = "uv run mutmut run"

[tasks.serve]
run = "fastmcp run"

# MCP Inspector: interactive tool/resource/prompt poking.
[tasks.dev]
run = "fastmcp dev inspector fastmcp.json"

# MCP Apps dev harness: live iframe render of the observatory.
[tasks.app]
run = "fastmcp dev apps fastmcp.json"

[tasks.install-claude-code]
run = "fastmcp install claude-code fastmcp.json --env-file .env.claude"

[tasks.install-claude-desktop]
run = "fastmcp install claude-desktop fastmcp.json --env-file .env.claude"

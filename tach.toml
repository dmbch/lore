# Lore's one-way hexagonal import graph (see docs/architecture.md).
# `tach check` (mise run tach) enforces three rules:
#   edges: depends_on is the real import graph, exactly (`exact`); an import
#     outside it fails the gate, and so does a grant no import uses.
#   root-routing: the single interface admits only public top-level members,
#     so no module reaches past another's package root.
#   utilities: the two ground modules are importable everywhere without a
#     declared edge.
# `tach sync` edits depends_on surgically and preserves the rest of the file.
# The destructive path is parse-time auto-migration, which rewrites the file
# wholesale and drops hand-written interfaces; the deprecated `strict = true`
# is the trigger to avoid.

source_roots = ["src"]
exact = true
forbid_circular_dependencies = true

# Load-bearing default, stated: layers annotate with `lore.config` types under
# TYPE_CHECKING only, and tach must not see those imports, or each one would
# read as an undeclared dependency and a visibility violation.
ignore_type_checking_imports = true

# A tach-ignore is held to the same bar as a noqa: live, and with a reason.
[rules]
unused_ignore_directives = "error"
require_ignore_directive_reasons = "error"

# A cross-module import names a public top-level member of the imported
# module, never an underscore name or a dotted path into its internals.
[[interfaces]]
expose = ["[^._][^.]*"]

# Ground: model mechanics (lore._pydantic) and shared vocabulary (lore.domain).
# The ground is itself ordered (domain imports _pydantic), an edge tach cannot
# see: utilities are importable everywhere, and edges into them go untracked.
[[modules]]
paths = ["lore._pydantic", "lore.domain"]
depends_on = []
utility = true

[[modules]]
path = "lore.telemetry"
depends_on = []

# The layer-owned config partials: leaf shapes lore.config composes, so the
# config module never needs a grant on any layer proper.
[[modules]]
paths = [
    "lore.adapter.config",
    "lore.math.config",
    "lore.prompts.config",
    "lore.providers.config",
    "lore.repositories.config",
]
depends_on = []

[[modules]]
path = "lore.math"
depends_on = ["lore.math.config"]

[[modules]]
path = "lore.prompts"
depends_on = ["lore.prompts.config"]

[[modules]]
path = "lore.providers"
depends_on = ["lore.providers.config"]

[[modules]]
path = "lore.repositories"
depends_on = ["lore.repositories.config"]

# Runtime consumers of settings are the composition roots; layers see
# LoreSettings under TYPE_CHECKING only (the rule stated above).
[[modules]]
path = "lore.config"
visibility = ["lore.server", "lore.__main__"]
depends_on = [
    "lore.adapter.config",
    "lore.math.config",
    "lore.prompts.config",
    "lore.providers.config",
    "lore.repositories.config",
]

[[modules]]
path = "lore.orchestrator"
depends_on = ["lore.math", "lore.prompts", "lore.repositories", "lore.telemetry"]

[[modules]]
path = "lore.adapter"
depends_on = ["lore.adapter.config", "lore.orchestrator", "lore.prompts"]

# No layer imports the composition root (docs/architecture.md, Bootstrap).
[[modules]]
path = "lore.server"
visibility = ["lore.__main__"]
depends_on = [
    "lore.adapter",
    "lore.config",
    "lore.math",
    "lore.orchestrator",
    "lore.providers",
    "lore.repositories",
    "lore.telemetry",
]

[[modules]]
path = "lore.__main__"
depends_on = ["lore.config", "lore.server"]

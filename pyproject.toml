[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lore"
# Placeholder only — hatchling needs it for build validity; nothing consumes it.
# The git tag is the authoritative version (see [tool.semantic_release]).
version = "0.0.0"
description = "Shared knowledge engine for centaur teams"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "sqlite-vec>=0.1.9",
    "psycopg[binary]>=3.3.4",
    "psycopg-pool>=3.3.1",
    "pgvector>=0.4.2",
    "structlog>=26.1.0",
    "opentelemetry-api>=1.43.0",
    "opentelemetry-sdk>=1.43.0",
    "opentelemetry-distro>=0.64b0",
    "opentelemetry-exporter-otlp>=1.43.0",
    "opentelemetry-instrumentation-psycopg>=0.64b0",
    "litellm>=1.83.0",
    # SOCKS extra so HTTPS_PROXY=socks5://... works under the Claude sandbox (no direct import).
    "httpx[socks]>=0.28.1",
    "instructor[litellm]>=1.15.4",
    "aiosqlite>=0.22.1",
    "pydantic>=2.13.4,<3",
    "fastmcp>=3.4.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.155.7",
    "ruff>=0.15.20",
    "pyright>=1.1.411",
    "testcontainers[postgres]>=4.14.2",
    "python-semantic-release>=10.6.1",
    "pytest-asyncio>=1.4.0",
    "commitizen>=4.16.3",
    "httpx2>=2.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = [".claude/worktrees", "references"]

[tool.ruff.lint]
select = [
    "ANN401",
    "ASYNC",
    "B",
    "C90",
    "E",
    "EM",
    "F",
    "FBT",
    "I",
    "PLR0913",
    "PYI",
    "RUF",
    "S",
    "SIM",
    "TID",
    "UP",
    "W",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.per-file-ignores]
"src/lore/math/**"           = ["RUF002", "RUF003"] # canonical unicode math notation
"tests/math/**"              = ["RUF002", "RUF003"] # math test docstrings mirror the notation
"src/lore/repositories/**"   = ["S608"]             # SQL is parameterized; S608 heuristic misfires
"tests/**"                   = ["S101", "S104", "S105", "S108", "S608", "EM", "ASYNC240"] # test-only patterns
"tests/conftest.py"          = ["E402"]             # every import sits below the FASTMCP_LOG_ENABLED off-switch by design

[tool.pyright]
include = ["src", "tests"]
stubPath = "typings"
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=lore --cov-report=term-missing --cov-config=pyproject.toml -m 'not e2e'"
asyncio_mode = "auto"
markers = ["e2e: end-to-end tests requiring real LLM and database"]
filterwarnings = [
    # litellm's logging worker drops queued success-handler coroutines at
    # event-loop teardown; fires only on live e2e calls. Fixed upstream but
    # unreachable behind the instructor litellm cap (see TODO.md); remove
    # this filter when the cap lifts.
    "ignore:coroutine 'Logging.async_success_handler' was never awaited:RuntimeWarning",
]

[tool.coverage.run]
source = ["lore"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.semantic_release]
allow_zero_version = true     # stay in 0.x; first release is v0.1.0, not 1.0.0
major_on_zero      = false    # a feat on 0.x bumps the minor, not to 1.0.0

[tool.commitizen]
name = "cz_customize"

[tool.commitizen.customize]
schema_pattern = '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^)]+\))?!?: .+'

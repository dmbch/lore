[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lore"
# Placeholder only — hatchling needs it for build validity; nothing consumes it.
# The git tag is the authoritative version (see [tool.semantic_release]).
version = "0.0.0"
description = "Shared knowledge engine for centaur teams"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "sqlite-vec>=0.1.9",
    "psycopg[binary]>=3.3.4",
    "psycopg-pool>=3.3.1",
    "pgvector>=0.4.2",
    "structlog>=25.5.0",
    "opentelemetry-api>=1.42.1",
    "opentelemetry-sdk>=1.42.1",
    "opentelemetry-distro>=0.63b1",
    "opentelemetry-exporter-otlp>=1.42.1",
    "opentelemetry-instrumentation-psycopg>=0.63b1",
    "litellm>=1.83.0",
    # SOCKS extra so HTTPS_PROXY=socks5://... works under the Claude sandbox (no direct import).
    "httpx[socks]>=0.28.1",
    "instructor[litellm]>=1.15.1",
    "aiosqlite>=0.22.1",
    "pydantic>=2.13.4,<3",
    "fastmcp>=3.3.1",
]

[project.scripts]
lore = "lore.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.152.9",
    "ruff>=0.15.15",
    "pyright>=1.1.409",
    "testcontainers[postgres]>=4.14.2",
    "python-semantic-release>=10.5.3",
    "pytest-asyncio>=1.4.0",
    "commitizen>=4.16.2",
]

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = [".claude/worktrees", "references"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
stubPath = "typings"
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=lore --cov-report=term-missing --cov-config=pyproject.toml -m 'not e2e'"
asyncio_mode = "auto"
markers = ["e2e: end-to-end tests requiring real LLM and database"]

[tool.coverage.run]
source = ["lore"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.semantic_release]
allow_zero_version = true     # stay in 0.x; first release is v0.1.0, not 1.0.0
major_on_zero      = false    # a feat on 0.x bumps the minor, not to 1.0.0

[tool.commitizen]
name = "cz_customize"

[tool.commitizen.customize]
schema_pattern = '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^)]+\))?!?: .+'

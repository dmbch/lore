[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lore"
# Placeholder only — hatchling needs it for build validity; nothing consumes it.
# The git tag is the authoritative version (see [tool.semantic_release]).
version = "0.0.0"
description = "Shared knowledge engine for centaur teams"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "sqlite-vec>=0.1.9",
    "psycopg[binary]>=3.3.4",
    "psycopg-pool>=3.3.1",
    "pgvector>=0.5.0",
    "structlog>=26.1.0",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.43.0",
    "opentelemetry-distro>=0.64b0",
    "opentelemetry-exporter-otlp>=1.43.0",
    "opentelemetry-instrumentation-psycopg>=0.64b0",
    # Since 1.92.0 litellm bundles a Rust extension with linux and windows
    # wheels only; on macOS the sdist builds against the mise-provisioned
    # Rust toolchain until upstream ships macOS wheels (BerriAI/litellm#31261).
    "litellm>=1.98.0",
    # SOCKS extra so HTTPS_PROXY=socks5://... works under the Claude sandbox (no direct import).
    "httpx[socks]>=0.28.1",
    # No [litellm] extra: litellm is a direct dependency above, and the extra
    # only adds instructor's litellm cap (<=1.83.7 as of 1.15.4), which pinned
    # the whole stack behind seven proxy-only security advisories. Those stay
    # unreachable only while Lore consumes litellm as an SDK client; starting
    # the litellm proxy re-exposes all seven.
    "instructor>=1.16.0",
    "aiosqlite>=0.22.1",
    "pydantic>=2.13.5,<3",
    "fastmcp[apps]>=3.4.7",
    # Direct dependency (fastmcp already ships it transitively): LoreCacheStore
    # subclasses its BaseStore, and the encryption extra provides the Fernet
    # wrapper for OAuth state at rest. Capped below 0.5: the store imports
    # ManagedEntry from a private module (the library's own BaseStore contract
    # forces it), so a minor bump carries no stability promise.
    "py-key-value-aio[wrappers-encryption]>=0.4.5,<0.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.165.10",
    "ruff>=0.16.4",
    "pyright[nodejs]>=1.1.411",
    "testcontainers[postgres]>=4.15.0",
    "python-semantic-release>=10.6.1",
    "pytest-asyncio>=1.4.0",
    "commitizen>=4.18.0",
    "httpx2>=2.12.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "tach>=0.35.0",
    "mutmut>=3.7.0",
    "packaging>=26.3",
]

[tool.uv]
# uv compatibility range, not an exact pin: Dependabot reads this field and
# runs its own (older) bundled uv, refusing on mismatch, so the floor stays
# below it. mise.toml, the Dockerfile, and the workflows' setup-uv steps
# carry the exact pin; scripts/check_pins.py keeps them equal and inside
# this range. Bump the ceiling in lockstep when the exact pin crosses a
# minor.
required-version = ">=0.11,<0.13"
# System, homebrew, and mise interpreters on PATH must not satisfy the
# python pin; only uv-managed pbs builds do. Containerized CI jobs and the
# image build override with UV_PYTHON_PREFERENCE=only-system to use the
# container's Debian CPython (env beats project config in uv's precedence).
python-preference = "only-managed"

[tool.ruff]
line-length = 100
target-version = "py314"
# extend-, not plain exclude: the default list (.venv, site-packages, ...) must
# survive. gitignore does not cover CI: the container checkout has no .git.
extend-exclude = [".claude/worktrees", "references"]

[tool.ruff.lint]
select = [
    "ANN401",
    "ASYNC",
    "B",
    "C90",
    "E",
    "EM",
    "F",
    "FBT",
    "I",
    "PLR0913",
    "PYI",
    "RUF",
    "S",
    "SIM",
    "TID",
    "UP",
    "W",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.per-file-ignores]
"src/lore/math/**"           = ["RUF002", "RUF003"] # canonical unicode math notation
"tests/math/**"              = ["RUF002", "RUF003"] # math test docstrings mirror the notation
"src/lore/repositories/**"   = ["S608"]             # SQL is parameterized; S608 heuristic misfires
"tests/**"                   = ["S101", "S104", "S105", "S108", "S608", "EM", "ASYNC240"] # test-only patterns
"tests/conftest.py"          = ["E402"]             # every import sits below the FASTMCP_LOG_ENABLED off-switch by design

[tool.pyright]
include = ["conftest.py", "scripts", "src", "tests"]
stubPath = "typings"
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
# -p no:tach: boundary enforcement is `tach check` (mise run tach); the pytest
# plugin only runs impact analysis nobody consumes and banners every run.
addopts = "-p no:tach --cov=lore --cov-report=term-missing --cov-config=pyproject.toml -m 'not e2e'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Global so an e2e module missing its session-loop mark fails in 300s with a
# stack dump instead of hanging forever; inert for the seconds-long unit suite.
timeout = 300
markers = ["e2e: end-to-end tests requiring real LLM and database"]

[tool.coverage.run]
source = ["lore"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.semantic_release]
allow_zero_version = true     # stay in 0.x; first release is v0.1.0, not 1.0.0
major_on_zero      = false    # a feat on 0.x bumps the minor, not to 1.0.0

# Release when the commit can change the image: feat/fix/perf/refactor/revert
# touch src; build approximates image-relevant (Dockerfile, toolchain), so a
# workflow-only build commit over-releases, accepted. chore, ci, docs, style
# and test cut nothing. Dependabot (.github/dependabot.yml) types prod-dep
# and base-image bumps fix(deps) and dev-dep bumps chore(deps-dev) to match.
# allowed_tags mirrors the commitizen schema_pattern below; PSR's default set
# lacks revert, which would otherwise fail to parse and never bump.
[tool.semantic_release.commit_parser_options]
minor_tags   = ["feat"]
patch_tags   = ["build", "fix", "perf", "refactor", "revert"]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "refactor", "revert", "style", "test"]

[tool.mutmut]
# Copy the whole package so `lore` resolves as a regular package inside
# mutants/ (source_paths = ["src/lore/math"] alone strips lore/__init__.py and
# lore.domain stops importing); restrict actual mutation to the math subtree.
source_paths = ["src/lore"]
only_mutate = ["src/lore/math/*"]
# Run ONLY the fast, self-contained math suite per mutant. Never the e2e lane.
pytest_add_cli_args_test_selection = ["tests/math"]
# Harness conftest silences Hypothesis's differing_executors health check, a
# false positive from mutmut running multiple pytest sessions in one process.
also_copy = ["conftest.py"]
# Neutralize the repo addopts inside mutants/: --cov=lore + fail_under=100 would
# fail every subset run (false kills, broken baseline). Clear addopts, drop cov.
# no:tach: the tach plugin's native thread deadlocks mutmut's forked mutant
# children (macOS); campaign sessions must stay single-threaded before fork.
pytest_add_cli_args = ["-p", "no:cov", "-p", "no:tach", "-o", "addopts="]

[tool.commitizen]
name = "cz_customize"

[tool.commitizen.customize]
schema_pattern = '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^)]+\))?!?: .+'

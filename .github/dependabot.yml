version: 2

# Commit types feed the release gate ([tool.semantic_release] in
# pyproject.toml): fix cuts a patch, chore and ci stay silent, so
# prod-dep and base-image bumps release while dev-dep and actions
# bumps do not.
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      # Daily so the cooldown below is the only latency; weekly stacked up
      # to a week of dead time on top of the quarantine.
      interval: daily
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    # Supply-chain quarantine, not a patch delay: cooldown covers version
    # updates only, never security updates, so an advisory still lands the
    # day it publishes. Flat days rather than per-semver windows, because a
    # malicious release ships as a patch precisely to draw the least
    # scrutiny; a short patch window would invert the defense.
    cooldown:
      default-days: 5
    groups:
      production:
        dependency-type: production
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      development:
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    cooldown:
      default-days: 5
    groups:
      actions:
        patterns:
          - "*"

  # No cooldown here on purpose. Base-image digest bumps are the only path an
  # OS-layer CVE fix has into this repo, and OS CVEs never reach the advisory
  # graph that exempts security updates, so any delay is a straight delay on
  # the fix. The risk it would buy down (a poisoned Docker Official Image) is
  # remote, and CI runs against the new base on the PR either way.
  - package-ecosystem: docker
    directory: /
    schedule:
      # Daily: no cooldown here (see below), so any check delay is a
      # straight delay on an OS CVE fix.
      interval: daily
    commit-message:
      prefix: fix
      include: scope
    groups:
      docker:
        patterns:
          - "*"

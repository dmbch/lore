version: 2

# Commit types feed the release gate ([tool.semantic_release] in
# pyproject.toml): build cuts a patch, chore and ci stay silent, so
# prod-dep bumps release while dev-dep and actions bumps do not.
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: build
      prefix-development: chore
      include: scope
    groups:
      production:
        dependency-type: production
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      development:
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: build
      include: scope
    groups:
      docker:
        patterns:
          - "*"

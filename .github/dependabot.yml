version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: daily
    groups:
      minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-patch:
        update-types:
          - minor
          - patch

name: Tests

on:
  workflow_call: {}

permissions:
  contents: read

# Job names below are required-check contexts in the Main Protection ruleset,
# reported as `tests / <job>` via the caller job in ci.yml. Renaming one (or
# the caller) wedges the merge gate until the ruleset is updated.
jobs:
  # All three jobs run inside the image base, so CI tests the interpreter the
  # image ships. The ref must match the Dockerfile, policed by
  # scripts/check_pins.py. UV_PYTHON_PREFERENCE=only-system makes uv take the
  # container's Debian CPython over pyproject's only-managed (env beats
  # project config); UV_PYTHON_DOWNLOADS=never mirrors the Dockerfile. The
  # `uv python find` step fails the job unless the container interpreter won.
  # The image is defined once as a YAML anchor (&python-image) and aliased
  # (*python-image) below: aliases resolve to the same scalar, so the three
  # jobs cannot drift apart, and a bump edits one line.
  lint:
    runs-on: ubuntu-latest
    container:
      image: &python-image python:3.14.7-slim-trixie@sha256:cae66f2ef0ec51a9891263eeee7f987dacf0a9879e8aa9353d5606e0530619a5
    env:
      UV_PYTHON_PREFERENCE: only-system
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          enable-cache: true
      - run: uv python find | grep '^/usr/local/bin/'
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python scripts/check_pins.py
      - run: uv run tach check

  typecheck:
    runs-on: ubuntu-latest
    container:
      image: *python-image
    env:
      UV_PYTHON_PREFERENCE: only-system
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          enable-cache: true
      - run: uv python find | grep '^/usr/local/bin/'
      - run: uv sync
      # pyright runs on node, which links libatomic; slim ships without it.
      - run: apt-get update && apt-get install -y --no-install-recommends libatomic1
      - run: uv run pyright

  test:
    runs-on: ubuntu-latest
    container:
      image: *python-image
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      UV_PYTHON_PREFERENCE: only-system
      UV_PYTHON_DOWNLOADS: never
      # Service DNS on the job network; a containerized job needs no port map.
      LORE_TEST_POSTGRES_DSN: postgresql://postgres:postgres@postgres:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          enable-cache: true
      - run: uv python find | grep '^/usr/local/bin/'
      - run: uv sync
      - run: uv run pytest

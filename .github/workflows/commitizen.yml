name: Commitizen
on: [pull_request]
permissions:
  contents: read
jobs:
  # Required check in the Main Protection ruleset; renaming the job wedges
  # the merge gate until the ruleset is updated.
  commitizen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.7"
          enable-cache: true
      - run: uv sync --only-group dev
      - run: uv run --no-sync cz check --rev-range ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

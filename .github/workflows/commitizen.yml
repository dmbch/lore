name: Commitizen
on: [pull_request]
permissions:
  contents: read
jobs:
  # Required check in the Main Protection ruleset; renaming the job wedges
  # the merge gate until the ruleset is updated.
  commitizen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with: { enable-cache: true }
      - run: uv sync --only-group dev
      - run: uv run --no-sync cz check --rev-range ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

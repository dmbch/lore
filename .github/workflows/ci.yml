name: CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  # The job name is the `tests /` prefix of the ruleset's required contexts;
  # renaming it wedges the merge gate until the ruleset is updated.
  tests:
    uses: ./.github/workflows/tests.yml
  # Fails the PR if it introduces a dependency with a known vulnerability,
  # via the dependency graph diff (which reads uv.lock). Required check;
  # same rename hazard as above.
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

# Daily CVE re-scan of the published image: the lane Dependabot cannot see.
# A frozen `latest` accumulates OS-layer CVEs with no change to this repo, so
# the trigger is time, not pushes. Findings land in code scanning under the
# `grype-image` category rather than failing the run; a fixable finding means
# rebuild and release. only-fixed skips the debian tail of no-fix CVEs that
# would otherwise be permanent noise.

name: Image Scan

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  grype:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload-sarif
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        id: scan
        with:
          image: ghcr.io/dmbch/lore:latest
          fail-build: false
          only-fixed: true
      - uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: grype-image

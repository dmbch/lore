# Daily CVE re-scan of the published image: the lane Dependabot cannot see.
# A frozen `latest` accumulates OS-layer CVEs with no change to this repo, so
# the trigger is time, not pushes. Findings land in code scanning under the
# `grype-image` category rather than failing the run; a fixable finding means
# rebuild and release. only-fixed skips the debian tail of no-fix CVEs that
# would otherwise be permanent noise.

name: Image Scan

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  grype:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload-sarif
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        id: scan
        with:
          image: ghcr.io/dmbch/lore:latest
          fail-build: false
          only-fixed: true
      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: grype-image

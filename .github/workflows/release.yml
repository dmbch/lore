name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize runs so two quick merges can't race to tag/publish.
concurrency:
  group: release
  cancel-in-progress: false

# Least privilege by default; the two jobs that write elevate explicitly.
permissions:
  contents: read

jobs:
  # One definition of "the checks", shared with the PR gate (ci.yml).
  gate:
    uses: ./.github/workflows/tests.yml

  # Is a release due? Pure calculation, no side effects: compare the next
  # computed version against the last released one (full history + tags).
  plan:
    needs: gate
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.detect.outputs.released }}
      version: ${{ steps.detect.outputs.version }}
      tag: ${{ steps.detect.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --only-group dev
      - id: detect
        run: |
          version=$(uv run --no-sync semantic-release version --print)
          last=$(uv run --no-sync semantic-release version --print-last-released)
          tag=$(uv run --no-sync semantic-release version --print-tag)
          echo "next=$version last=$last tag=$tag"
          if [ "$version" != "$last" ]; then
            {
              echo "released=true"
              echo "version=$version"
              echo "tag=$tag"
            } >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  # Real LLM + SQLite, xdist with the knowledge arc pinned to one worker.
  # --no-cov: the suite's fail_under=100 gate would fail on the e2e subset.
  # The job timeout is the backstop against the deadlock class that got this
  # gate removed in 2026-07. The run line mirrors mise.toml [tasks.e2e];
  # keep the flags in sync.
  e2e:
    needs: plan
    if: needs.plan.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pytest -m e2e --no-cov -n auto --dist loadgroup --durations=20
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  # Build the image and prove it boots + serves before anything is tagged.
  smoke:
    needs: plan
    if: needs.plan.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t lore:smoke .
      - run: tests/container/smoke.sh lore:smoke
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  # Gate is structural: tag only after e2e AND smoke are green. Tag-only —
  # no commit to main (protected); tags are unprotected so GITHUB_TOKEN pushes.
  release:
    needs: [plan, e2e, smoke]
    if: needs.plan.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag the merged HEAD
        run: |
          git tag "${{ needs.plan.outputs.tag }}"
          git push origin "${{ needs.plan.outputs.tag }}"

  # Multi-arch build from the tag → GHCR → provenance/SBOM → GitHub Release.
  publish:
    needs: [plan, release]
    if: needs.plan.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the Release
      packages: write # push to GHCR
      id-token: write # OIDC for provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag }}
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # Trigger ref is `main`, not a tag, so feed the version explicitly.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.plan.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.plan.outputs.version }}
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            LORE_VERSION=${{ needs.plan.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          generate_release_notes: true
          append_body: true
          body: |
            ## Container image

            ```
            docker pull ghcr.io/${{ github.repository }}:${{ needs.plan.outputs.version }}
            ```

            Digest: `${{ steps.build.outputs.digest }}`

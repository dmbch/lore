name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize runs so two quick merges can't race to tag/publish.
concurrency:
  group: release
  cancel-in-progress: false

# Least privilege by default; the two jobs that write elevate explicitly.
permissions:
  contents: read

jobs:
  # One definition of "the checks", shared with the PR gate (ci.yml).
  gate:
    uses: ./.github/workflows/tests.yml

  # Is a release due? Pure calculation, no side effects: compare the next
  # computed version against the last released one (full history + tags).
  plan:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.detect.outputs.released }}
      version: ${{ steps.detect.outputs.version }}
      tag: ${{ steps.detect.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv sync --only-group dev
      - id: detect
        run: |
          version=$(uv run --no-sync semantic-release version --print)
          last=$(uv run --no-sync semantic-release version --print-last-released)
          tag=$(uv run --no-sync semantic-release version --print-tag)
          echo "next=$version last=$last tag=$tag"
          if [ "$version" != "$last" ]; then
            {
              echo "released=true"
              echo "version=$version"
              echo "tag=$tag"
            } >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  # Real LLM + SQLite, xdist with the knowledge arc pinned to one worker.
  # --no-cov: the suite's fail_under=100 gate would fail on the e2e subset.
  # The job timeout is the backstop against the deadlock class that got this
  # gate removed in 2026-07. The run line mirrors mise.toml [tasks.e2e];
  # keep the flags in sync.
  e2e:
    needs: plan
    if: needs.plan.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv sync
      - run: uv run pytest -m e2e --no-cov -n auto --dist loadgroup --durations=20
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  # Build the release candidate once: the exact multi-arch manifest that ships.
  # Pushed by digest only (untagged); smoke boots it per platform and publish
  # promotes the same digest, so the tested artifact is the shipped one. Built
  # from github.sha, the same commit the release job tags. Runs that fail
  # before publish strand an untagged index here: accepted litter. Never GC
  # untagged GHCR versions naively; platform children of tagged indexes are
  # themselves untagged, and production pins by digest (SECURITY.md).
  build:
    needs: plan
    if: needs.plan.outputs.released == 'true'
    runs-on: ubuntu-latest
    # Cold-cache arm64 under QEMU is legitimately slow; cap well short of the
    # 6h default.
    timeout-minutes: 45
    permissions:
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Labels only, but the tags input is live: it feeds the
      # org.opencontainers.image.version label. outputs.tags stays unused;
      # the release tags land at publish via imagetools.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.plan.outputs.version }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            LORE_VERSION=${{ needs.plan.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Boot the candidate and prove it serves, per shipped platform, each on its
  # native runner (arm64 hosted runners are free for public repos). Each
  # runner resolves its own platform child from the index digest. Keyless by
  # design: /ready probes storage, not the model, and smoke.sh stubs the key.
  smoke:
    needs: [plan, build]
    if: needs.plan.outputs.released == 'true'
    strategy:
      matrix:
        # Both legs pin the same image version (there is no latest-arm alias)
        # so the only variable across the matrix is the architecture.
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: tests/container/smoke.sh ghcr.io/${{ github.repository }}@${{ needs.build.outputs.digest }}

  # Gate is structural: tag only after gate, e2e AND smoke are green. Tag-only —
  # no commit to main (protected); tags are unprotected so GITHUB_TOKEN pushes.
  release:
    needs: [gate, plan, e2e, smoke]
    if: needs.plan.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag the merged HEAD
        run: |
          git tag "${{ needs.plan.outputs.tag }}"
          git push origin "${{ needs.plan.outputs.tag }}"

  # Promote the smoke-tested digest to the release tags: a registry-side
  # manifest copy, never a rebuild. Attestation and Release ride the same
  # digest. If the run dies after release has pushed the tag, recover with
  # "Re-run failed jobs" on the same run: a fresh run's plan would see the
  # tag, compute released=false, and never reach this job.
  publish:
    needs: [plan, release, build]
    if: needs.plan.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the Release
      packages: write # push tags to GHCR
      id-token: write # OIDC for provenance attestation
      attestations: write
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the candidate as the release
        run: |
          version="${{ needs.plan.outputs.version }}"
          image="ghcr.io/${{ github.repository }}"
          docker buildx imagetools create \
            -t "$image:$version" \
            -t "$image:${version%.*}" \
            -t "$image:latest" \
            "$image@${{ needs.build.outputs.digest }}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ needs.build.outputs.digest }}
          push-to-registry: true
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          generate_release_notes: true
          append_body: true
          body: |
            ## Container image

            ```
            docker pull ghcr.io/${{ github.repository }}:${{ needs.plan.outputs.version }}
            ```

            Digest: `${{ needs.build.outputs.digest }}`

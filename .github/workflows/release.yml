name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize runs so two quick merges can't race to tag/publish.
concurrency:
  group: release
  cancel-in-progress: false

# Least privilege by default; the two jobs that write elevate explicitly.
permissions:
  contents: read

jobs:
  # One definition of "the checks", shared with the PR gate (ci.yml).
  gate:
    uses: ./.github/workflows/tests.yml

  # Is a release due? Pure calculation, no side effects: compare the next
  # computed version against the last released one (full history + tags).
  plan:
    needs: gate
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.detect.outputs.released }}
      version: ${{ steps.detect.outputs.version }}
      tag: ${{ steps.detect.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --only-group dev
      - id: detect
        run: |
          version=$(uv run --no-sync semantic-release version --print)
          last=$(uv run --no-sync semantic-release version --print-last-released)
          tag=$(uv run --no-sync semantic-release version --print-tag)
          echo "next=$version last=$last tag=$tag"
          if [ "$version" != "$last" ]; then
            {
              echo "released=true"
              echo "version=$version"
              echo "tag=$tag"
            } >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  # Real LLM + SQLite. --no-cov: the suite's fail_under=100 gate would fail
  # on the e2e subset otherwise.
  e2e:
    needs: plan
    if: needs.plan.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pytest -m e2e --no-cov
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  # Build the image and prove it boots + serves before anything is tagged.
  smoke:
    needs: plan
    if: needs.plan.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t lore:smoke .
      - run: tests/container/smoke.sh lore:smoke
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  # Gate is structural: tag only after e2e AND smoke are green. Tag-only —
  # no commit to main (protected); tags are unprotected so GITHUB_TOKEN pushes.
  release:
    needs: [plan, e2e, smoke]
    if: needs.plan.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Tag the merged HEAD
        run: |
          git tag "${{ needs.plan.outputs.tag }}"
          git push origin "${{ needs.plan.outputs.tag }}"

  # Multi-arch build from the tag → GHCR → provenance/SBOM → GitHub Release.
  publish:
    needs: [plan, release]
    if: needs.plan.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the Release
      packages: write # push to GHCR
      id-token: write # OIDC for provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.tag }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # Trigger ref is `main`, not a tag, so feed the version explicitly.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.plan.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.plan.outputs.version }}
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            LORE_VERSION=${{ needs.plan.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          generate_release_notes: true
          append_body: true
          body: |
            ## Container image

            ```
            docker pull ghcr.io/${{ github.repository }}:${{ needs.plan.outputs.version }}
            ```

            Digest: `${{ steps.build.outputs.digest }}`
